CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Display configuration
CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y
CONFIG_SSD1306=y
CONFIG_ZMK_DISPLAY_STATUS=y
CONFIG_ZMK_DISPLAY_STATUS_BATTERY=y
CONFIG_ZMK_DISPLAY_STATUS_LAYERS=y

# Display timing
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=2048
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=5
CONFIG_ZMK_DISPLAY_REFRESH_RATE=60

# Add these recommended settings
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# I2C Timing
CONFIG_I2C_NRFX_TWIM=y
CONFIG_I2C_NRFX_TWIM_0=y
CONFIG_I2C_INIT_PRIORITY=60

# Uncomment these for debugging if you have display issues
# CONFIG_LOG=y
# CONFIG_LOG_MAX_LEVEL=4
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_I2C_LOG_LEVEL_DBG=y
# CONFIG_DISPLAY_LOG_LEVEL_DBG=y
# CONFIG_SSD1306_LOG_LEVEL_DBG=y
